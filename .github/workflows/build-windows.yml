name: Build Windows standalone package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up 64-bit Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"

      - name: Build and verify standalone package
        shell: powershell
        run: .\build_windows.ps1

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: FirewallSummary-Windows-x64
          path: release/FirewallSummary-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
